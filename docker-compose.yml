services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:18
    container_name: servicehub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: servicehub
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servicehub}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U servicehub -d servicehub"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ============================================================
  # Redis
  # ============================================================

  redis:
    image: redis:8-alpine
    container_name: servicehub-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  # ============================================================
  # FastAPI Backend
  # ============================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: servicehub-backend
    restart: unless-stopped
    init: true

    env_file:
      - ./backend/.env.docker

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend:/app

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; response = urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3); raise SystemExit(0 if response.status == 200 else 1)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ============================================================
  # Celery Worker
  # ============================================================

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: servicehub-celery-worker
    restart: unless-stopped
    init: true

    env_file:
      - ./backend/.env.docker

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend:/app

    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app.celery_app",
        "worker",
        "--loglevel=INFO"
      ]


  # ============================================================
  # Vue + Vite Frontend
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: servicehub-frontend
    restart: unless-stopped
    init: true

    ports:
      - "5173:5173"

    depends_on:
      backend:
        condition: service_healthy

    volumes:
      # Mount source code for Vite HMR
      - ./frontend:/app

      # Keep Linux container node_modules separate
      - frontend_node_modules:/app/node_modules

    command:
      [
        "npm",
        "run",
        "dev",
        "--",
        "--host",
        "0.0.0.0"
      ]

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5173/"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


# ============================================================
# Named Volumes
# ============================================================

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
